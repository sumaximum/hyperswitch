name: Build MAXFI Custom Hyperswitch

on:
  push:
    branches:
      - 'maxfi/**'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/maxfiregistry

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DO Container Registry
        run: doctl registry login --expiry-seconds 3600

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=$(echo ${{ github.ref_name }} | sed 's/\//-/g')
          echo "tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "latest_tag=${BRANCH}-latest" >> $GITHUB_OUTPUT

      # Router: full build, caches planner+builder stages via GHA cache
      - name: Build and push Router image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/hyperswitch-router:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/hyperswitch-router:${{ steps.version.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BINARY=router
            EXTRA_FEATURES=

      # Consumer: reuses cached builder stage (only final COPY differs)
      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/hyperswitch-consumer:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/hyperswitch-consumer:${{ steps.version.outputs.latest_tag }}
          cache-from: type=gha
          build-args: |
            BINARY=scheduler
            SCHEDULER_FLOW=consumer
            EXTRA_FEATURES=

      - name: Build and push Producer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/hyperswitch-producer:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/hyperswitch-producer:${{ steps.version.outputs.latest_tag }}
          cache-from: type=gha
          build-args: |
            BINARY=scheduler
            SCHEDULER_FLOW=producer
            EXTRA_FEATURES=

      - name: Build and push Drainer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/hyperswitch-drainer:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/hyperswitch-drainer:${{ steps.version.outputs.latest_tag }}
          cache-from: type=gha
          build-args: |
            BINARY=drainer
            EXTRA_FEATURES=
